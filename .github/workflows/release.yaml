name: Release

# Push a tag that matches the manifest version (e.g. 1.3.0) to publish a release.
# The Marketplace only sees full GitHub releases, and requires the tag to match
# the "version" in manifest.json.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"

      - name: Check the tag matches the manifest version
        run: |
          version=$(jq -r .version custom_components/felicita_scale/manifest.json)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.14"
      - uses: "astral-sh/setup-uv@v7"
      - run: uv pip install --system -r requirements_test.txt
      - run: pytest

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--generate-notes --verify-tag"
          case "$GITHUB_REF_NAME" in *[a-z]*) flags="$flags --prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" $flags
